# ShopMate 生产环境 Nginx 配置（阶段 14）
#
# 与 web/nginx.conf（开发/演示）的差异：
#   * 运行在只读根文件系统上：pid、临时目录、缓存目录全部落在 /tmp 与 /var/cache/nginx tmpfs；
#   * 增加 CSP / Permissions-Policy / server_tokens off 等生产安全头；
#   * 对登录/注册路径做边缘限流，挡住明显的撞库流量（应用层仍有 Redis 限流）；
#   * 静态资源长缓存 + index.html 不缓存，避免发布后客户端拿到旧入口。
#
# TLS 终止建议放在上游边缘代理（Caddy/Nginx/云 LB）：本容器只监听 8080 明文，
# 由边缘代理转发并终结 HTTPS。启用 TLS 后再打开下面的 HSTS。

pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    # 容器内日志统一走 stdout/stderr，由 Docker json-file 驱动做轮转。
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 75s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 边缘限流：认证端点 30 次/分钟/IP；其余 API 不在这里限，交给应用层 Redis 限流器。
    limit_req_zone $binary_remote_addr zone=shopmate_auth:10m rate=30r/m;
    limit_req_status 429;

    upstream shopmate_api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ---- 安全响应头 ----------------------------------------------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Element Plus / Vue 运行时需要 inline style；脚本只允许同源打包产物。
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
        # 仅在边缘已完成 HTTPS 终结后启用：
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # 认证端点：先过边缘限流，再进 API。
        location /api/v1/auth/ {
            limit_req zone=shopmate_auth burst=20 nodelay;
            proxy_pass http://shopmate_api;
            include /etc/nginx/conf.d/shopmate-proxy.inc;
        }

        # API 反代（同源，免 CORS）。SSE 必须关闭缓冲，否则事件会被攒批下发。
        location /api/ {
            proxy_pass http://shopmate_api;
            include /etc/nginx/conf.d/shopmate-proxy.inc;
        }

        # Vite 产物带内容哈希，可长期缓存。
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 入口 HTML 不缓存，保证发版后立刻生效。
        location = /index.html {
            add_header Cache-Control "no-store";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

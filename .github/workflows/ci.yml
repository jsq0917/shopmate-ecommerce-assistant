name: ci

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Validate production Compose configuration
        run: docker compose -f compose.prod.yaml --env-file .env.prod.example config --quiet

      - name: Deployment security review (strict)
        run: uv run python scripts/check_deploy_security.py --strict

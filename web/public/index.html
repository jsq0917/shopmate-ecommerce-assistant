<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShopMate</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        background: #f5f7f4;
        color: #17342d;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(40rem, calc(100% - 3rem));
        padding: 2.5rem;
        border: 1px solid #cad8d1;
        border-radius: 1rem;
        background: #ffffff;
        box-shadow: 0 1rem 3rem rgb(23 52 45 / 8%);
      }

      h1 {
        margin-top: 0;
      }

      code {
        padding: 0.15rem 0.35rem;
        border-radius: 0.3rem;
        background: #edf3ef;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ShopMate 基础服务已就绪</h1>
      <p>当前为阶段 4 脚手架页面。消费者聊天与企业知识库界面将在后续阶段实现。</p>
      <p>健康检查：<code>/healthz</code></p>
    </main>
  </body>
</html>
